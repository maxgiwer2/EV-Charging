name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, analyse, test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ev_charging_test
          MYSQL_ROOT_PASSWORD: secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify migrations run cleanly
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ev_charging_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan migrate --force --no-interaction

      # Migrations must also be reversible -- financial schema changes get
      # rolled back during incident response (docs/03 -> backup/restore).
      - name: Verify migrations roll back
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ev_charging_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan migrate:rollback --force --no-interaction --step=100

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Catches an unsafe default reaching main: the same checks that
      # ProductionServiceProvider enforces at boot (docs/14-deployment.md).
      # Run with production-shaped config rather than the CI .env.
      - name: Production configuration check
        env:
          APP_DEBUG: "false"
          APP_URL: https://ci.example.com
          SESSION_SECURE_COOKIE: "true"
          SESSION_ENCRYPT: "true"
          QUEUE_CONNECTION: redis
          DB_CONNECTION: mysql
        run: php artisan app:check-production

      - name: Tests (Pest)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ev_charging_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
        run: php artisan test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit for known CVEs
        run: composer audit
