; Application PHP settings. Values here are development-oriented;
; production overrides live in docs/deployment.md.

memory_limit = 512M

; Receipt uploads: docs/02 FR-004 allows JPG/PNG/WEBP/PDF. The hard cap is
; enforced in application validation as well -- this is only the transport limit.
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 120

; Never leak stack traces to HTTP responses; the container logs are the
; source of truth (docs/03 -> structured logging).
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
